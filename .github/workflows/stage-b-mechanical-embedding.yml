name: Stage B1 - Mechanical embedding QM/MM
on:
  workflow_dispatch:
  push:
    branches: ["stage-b/mechanical-embedding"]
    paths:
      - "scripts/stage_b_mechanical_embedding.py"
      - ".github/workflows/stage-b-mechanical-embedding.yml"
permissions:
  contents: read
jobs:
  mechanical-embedding:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install real GROMACS CPU executable
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gromacs
          gmx --version
      - name: Install molecular stack and pinned TFEP
        run: |
          python -m pip install "torch==2.4.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy==1.26.4" "MDAnalysis==2.7.0" "pint==0.24.4" "requests==2.32.3" "remotezip==0.12.3" "tblite==0.3.0" "pyedr==0.8.0" "pyedr>=0.7,<1"
          python -m pip install --no-deps "git+https://github.com/andrrizzi/tfep.git@0bc369a1194c688bb6ac997cc6b7c2db2b063c9e"
      - name: Check out original physical topology and MDP sources
        run: |
          git clone -q https://github.com/andrrizzi/paper-alchemical-tfep-qmmm-2026.git upstream-stage-b
          git -C upstream-stage-b checkout -q b8dfd897ebd914b4e592221710b397a2758353ce
      - name: Evaluate and audit subtractive mechanical embedding
        run: |
          set -o pipefail
          mkdir -p results/stage-b/mechanical-embedding
          python -m pip freeze > results/stage-b/mechanical-embedding/environment.txt
          python -u scripts/stage_b_mechanical_embedding.py 2>&1 | tee results/stage-b/mechanical-embedding/experiment.log
      - name: Preserve all diagnostics including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-b1-mechanical-embedding
          path: |
            results/stage-b/mechanical-embedding/*.json
            results/stage-b/mechanical-embedding/*.log
            results/stage-b/mechanical-embedding/*.txt
            results/stage-b/mechanical-embedding/*.mdp
            results/stage-b/mechanical-embedding/working/rerun-full/*.log
            results/stage-b/mechanical-embedding/working/rerun-ligand/*.log
          if-no-files-found: warn
