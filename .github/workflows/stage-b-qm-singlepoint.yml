name: Stage B0 - Published ligand GFN1-xTB singlepoint
on:
  workflow_dispatch:
  push:
    branches: ["stage-b/qm-singlepoint"]
    paths:
      - "scripts/stage_b_qm_singlepoint.py"
      - ".github/workflows/stage-b-qm-singlepoint.yml"
permissions:
  contents: read
jobs:
  ligand-qm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install real semiempirical QM engine
        run: |
          python -m pip install "numpy==1.26.4" "requests==2.32.3" "remotezip==0.12.3" "tblite==0.3.0"
      - name: Run GFN1-xTB and gradient finite difference
        run: |
          python -m pip freeze > environment.txt
          python scripts/stage_b_qm_singlepoint.py | tee singlepoint.log
          cp environment.txt singlepoint.log results/stage-b/qm-singlepoint/
      - name: Upload small inputs inventory and scientific output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-b0-qm-singlepoint
          path: results/stage-b/qm-singlepoint/
          if-no-files-found: warn
