name: Stage B0 - Published ligand GFN1-xTB singlepoint
on:
  workflow_dispatch:
  push:
    branches: ["stage-b/qm-singlepoint"]
    paths:
      - "scripts/stage_b_qm_singlepoint.py"
      - ".github/workflows/stage-b-qm-singlepoint.yml"
permissions:
  contents: read
jobs:
  ligand-qm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned CPU TFEP and molecular stack
        run: |
          python -m pip install "torch==2.4.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy==1.26.4" "MDAnalysis==2.7.0" "pint==0.24.4" "requests==2.32.3" "remotezip==0.12.3" "tblite==0.3.0"
          python -m pip install --no-deps "git+https://github.com/andrrizzi/tfep.git@0bc369a1194c688bb6ac997cc6b7c2db2b063c9e"
      - name: Real ligand geometry and QM/autograd audit
        run: |
          set -o pipefail
          mkdir -p results/stage-b/qm-singlepoint
          python -m pip freeze > results/stage-b/qm-singlepoint/environment.txt
          python -u scripts/stage_b_qm_singlepoint.py 2>&1 | tee results/stage-b/qm-singlepoint/singlepoint.log
      - name: Upload scientific outputs (including failure diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-b0-qm-singlepoint
          path: results/stage-b/qm-singlepoint/
          if-no-files-found: warn
