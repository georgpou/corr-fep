name: Stage A3 - Matched objective comparison
on:
  workflow_dispatch:
  # Connector has no workflow-dispatch mutation; the feature-branch push
  # runs the first experiment. Manual dispatch remains available afterward.
  push:
    branches:
      - stage-a/objective-comparison
    paths:
      - "scripts/stage_a_multimodal.py"
      - "scripts/summarize_stage_a_objectives.py"
      - ".github/workflows/stage-a-objective-comparison.yml"
permissions:
  contents: read
jobs:
  objectives:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned TFEP and CPU environment
        run: |
          python -m pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . "matplotlib==3.9.2" "pint==0.24.4"
          python -m pip install --no-deps "git+https://github.com/andrrizzi/tfep.git@0bc369a1194c688bb6ac997cc6b7c2db2b063c9e"
      - name: Matched seed pairs (350 steps and one target call per batch)
        run: |
          set -o pipefail
          mkdir -p results/stage-a/objective-comparison
          python -m pip freeze > results/stage-a/objective-comparison/environment.txt
          python scripts/stage_a_multimodal.py --objective baseline --n-test 8192 --out results/stage-a/objective-comparison/baseline | tee results/stage-a/objective-comparison/baseline.log
          python scripts/stage_a_multimodal.py --objective hellinger --beta 0.5 --n-test 8192 --out results/stage-a/objective-comparison/hellinger | tee results/stage-a/objective-comparison/hellinger.log
          python scripts/summarize_stage_a_objectives.py --root results/stage-a/objective-comparison
      - name: Upload scientific outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a3-objective-comparison
          path: results/stage-a/objective-comparison/
          if-no-files-found: warn
