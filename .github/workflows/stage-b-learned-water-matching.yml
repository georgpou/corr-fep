name: Stage B - Actual learned-map water assignment probe
on:
  workflow_dispatch:
  push:
    branches: ["stage-b/water-matching-validity-audit"]
    paths:
      - ".github/workflows/stage-b-learned-water-matching.yml"
      - "scripts/stage_b_learned_water_matching.py"
permissions:
  contents: read
  actions: read
jobs:
  frozen-checkpoint-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned numerical libraries
        run: |
          python -m pip install "torch==2.4.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy==1.26.4" "MDAnalysis==2.7.0" "pint==0.24.4" "requests==2.32.3" "remotezip==0.12.3" "tblite==0.3.0" "pyedr==0.8.0"
          python -m pip install "lightning==2.4.0" "networkx==3.3" "h5py==3.11.0" "einops==0.8.0"
          python -m pip install --no-deps "git+https://github.com/noegroup/bgflow.git@fbba56fac3eb88f6825d2bd4f745ee75ae9715e1"
          python -m pip install --no-deps "git+https://github.com/andrrizzi/tfep.git@0bc369a1194c688bb6ac997cc6b7c2db2b063c9e"
      - name: Checkout pinned published driver
        run: |
          git clone -q https://github.com/andrrizzi/paper-alchemical-tfep-qmmm-2026.git upstream-stage-b
          git -C upstream-stage-b checkout -q b8dfd897ebd914b4e592221710b397a2758353ce
      - name: Retrieve existing trained checkpoint and preprocessing (no retraining)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38180943734 --repo georgpou/corr-fep --name stage-b25-author-full-baseline --dir saved-baseline
          test -s saved-baseline/update-21.pt
          test -s saved-baseline/author-preprocess.npz
          test -s saved-baseline/full-baseline.json
          du -sh saved-baseline
      - name: Actual learned-flow assignment probe (no QM/MM)
        run: |
          set -eo pipefail
          PYTHONPATH=scripts python -u scripts/stage_b_learned_water_matching.py | tee learned-matching.log
      - name: Publish diagnostic, including error state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learned-water-matching
          path: |
            results/stage-b/learned-water-matching/*.json
            results/stage-b/learned-water-matching/adapted-match-waters.py
            learned-matching.log
          if-no-files-found: warn
