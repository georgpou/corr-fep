name: Stage A - MAF Gaussian diagnostics
on:
  workflow_dispatch:
  # Cheap CPU experiment, scoped to the initial Stage A feature branch only.
  # Enables actual cloud execution while the workflow is not yet on main.
  push:
    branches:
      - stage-a/maf-gaussian-baseline
    paths:
      - "scripts/stage_a_gaussian.py"
      - ".github/workflows/stage-a-flow-diagnostics.yml"
permissions:
  contents: read
jobs:
  gaussian-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU scientific environment and pinned upstream TFEP
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . "matplotlib==3.9.2" "pint==0.24.4"
          python -m pip install --no-deps "git+https://github.com/andrrizzi/tfep.git@0bc369a1194c688bb6ac997cc6b7c2db2b063c9e"
      - name: Train actual TFEP MAF and save diagnostics
        run: |
          python scripts/stage_a_gaussian.py --steps 250 --seed 17 --out results/stage-a/baseline
      - name: Publish experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-gaussian-baseline
          path: results/stage-a/baseline/
          if-no-files-found: warn
