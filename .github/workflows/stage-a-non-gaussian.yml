name: Stage A - Non-Gaussian overlap diagnosis
on:
  workflow_dispatch:
  push:
    branches:
      - stage-a/non-gaussian-pathology
    paths:
      - "scripts/stage_a_multimodal.py"
      - ".github/workflows/stage-a-non-gaussian.yml"
permissions:
  contents: read
jobs:
  multimodal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned TFEP and CPU environment
        run: |
          python -m pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . "matplotlib==3.9.2" "pint==0.24.4"
          python -m pip install --no-deps "git+https://github.com/andrrizzi/tfep.git@0bc369a1194c688bb6ac997cc6b7c2db2b063c9e"
      - name: Three-seed original-loss experiments
        run: |
          python -m pip freeze > environment.txt
          python scripts/stage_a_multimodal.py --out results/stage-a/non-gaussian
          cp environment.txt results/stage-a/non-gaussian/environment.txt
      - name: Upload scientific outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-non-gaussian
          path: results/stage-a/non-gaussian/
          if-no-files-found: warn
