name: Stage B - Water matching invariance (no QM)
on:
  workflow_dispatch:
  push:
    branches: ["stage-b/water-matching-validity-audit"]
    paths:
      - "scripts/stage_b_water_matching_invariance.py"
      - ".github/workflows/stage-b-water-matching-invariance.yml"
permissions:
  contents: read
jobs:
  assignment-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned libraries (no GROMACS runtime, no QM evaluation)
        run: |
          python -m pip install "torch==2.4.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy==1.26.4" "MDAnalysis==2.7.0" "pint==0.24.4" "requests==2.32.3" "remotezip==0.12.3" "tblite==0.3.0" "pyedr==0.8.0"
          python -m pip install "lightning==2.4.0" "networkx==3.3" "h5py==3.11.0" "einops==0.8.0"
          python -m pip install --no-deps "git+https://github.com/noegroup/bgflow.git@fbba56fac3eb88f6825d2bd4f745ee75ae9715e1"
          python -m pip install --no-deps "git+https://github.com/andrrizzi/tfep.git@0bc369a1194c688bb6ac997cc6b7c2db2b063c9e"
      - name: Checkout pinned authors' matching implementation
        run: |
          git clone -q https://github.com/andrrizzi/paper-alchemical-tfep-qmmm-2026.git upstream-stage-b
          git -C upstream-stage-b checkout -q b8dfd897ebd914b4e592221710b397a2758353ce
      - name: Probe archived frames (9 x 9 ligand-only cases; no QM)
        run: |
          set -eo pipefail
          PYTHONPATH=scripts python -u scripts/stage_b_water_matching_invariance.py | tee water-probe.log
      - name: Upload diagnostic, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-matching-invariance
          path: |
            results/stage-b/water-matching-invariance/*.json
            results/stage-b/water-matching-invariance/adapted-match-waters.py
            water-probe.log
          if-no-files-found: warn
